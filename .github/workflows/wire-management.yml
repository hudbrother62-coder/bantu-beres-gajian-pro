name: Wire management views
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal App wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          if "import { TeamManagement } from './team-management'" not in s:
              s=s.replace("import { NotificationCenter } from './notifications'", "import { NotificationCenter } from './notifications'\nimport { TeamManagement } from './team-management'\nimport { RequestManagement } from './request-management'")
          s=s.replace("['Tim',ShieldCheck,['owner']]", "['Tim',ShieldCheck,['owner','hr_admin']]")
          s=s.replace("if(page==='Pengajuan')return <Requests profile={profile}/>", "if(page==='Pengajuan')return <RequestManagement profile={profile}/>")
          s=s.replace("if(page==='Tim')return <Team profile={profile}/>", "if(page==='Tim')return <TeamManagement profile={profile}/>")
          p.write_text(s)
          PY
      - name: Commit wiring if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "feat: wire team and request management"
          git push
