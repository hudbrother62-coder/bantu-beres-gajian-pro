name: Wire editable setup modules
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply setup module wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          anchor="import { RequestManagement } from './request-management'"
          addition=anchor+"\nimport { WorkSetupManagement, PayrollComponentsManagement } from './setup-management'"
          if "from './setup-management'" not in s:
              s=s.replace(anchor,addition)
          s=s.replace("if(page==='Jadwal & Lokasi')return <WorkSetup profile={profile}/>", "if(page==='Jadwal & Lokasi')return <WorkSetupManagement profile={profile}/>")
          s=s.replace("if(page==='Komponen Gaji')return <PayrollComponents profile={profile}/>", "if(page==='Komponen Gaji')return <PayrollComponentsManagement profile={profile}/>")
          if 'void WorkSetup; void PayrollComponents' not in s:
              s=s.replace('void Requests; void Team','void Requests; void Team; void WorkSetup; void PayrollComponents')
          p.write_text(s)
          PY
      - name: Commit if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "feat: wire editable setup modules"
          git push
