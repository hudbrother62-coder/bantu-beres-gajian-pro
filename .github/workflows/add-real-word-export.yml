name: Add real Word export
on:
  push:
    paths:
      - .github/workflows/add-real-word-export.yml
permissions:
  contents: write
jobs:
  upgrade_word:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install DOCX library
        run: npm install docx --save
      - name: Patch report export
        run: python3 scripts/upgrade_word_export.py
      - name: Verify production build
        run: npm run build
      - name: Commit upgrade
        run: |
          rm .github/workflows/add-real-word-export.yml
          rm scripts/upgrade_word_export.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: export editable Word DOCX reports'
          git push
