name: Finalize employee import and guide
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Wire modules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx')
          s=p.read_text()
          old="import { EmployeeWorkflow, CompanyWorkflow } from './employees'"
          new="import { CompanyWorkflow } from './employees'\nimport { EmployeeManagement } from './employee-management'\nimport { GuideManagement } from './guide-management'"
          if old not in s:
              raise SystemExit('employee import anchor not found')
          s=s.replace(old,new,1)
          old_nav="['Laporan',FileText,['owner','hr_admin','finance']],['Pengaturan',Settings,['owner','hr_admin']]"
          new_nav="['Laporan',FileText,['owner','hr_admin','finance']],['Panduan',FileText,['owner','hr_admin','finance','supervisor','employee']],['Pengaturan',Settings,['owner','hr_admin']]"
          if old_nav not in s:
              raise SystemExit('navigation anchor not found')
          s=s.replace(old_nav,new_nav,1)
          old_content="if(page==='Karyawan')return <EmployeeWorkflow profile={profile}/>;"
          new_content="if(page==='Karyawan')return <EmployeeManagement profile={profile}/>;"
          if old_content not in s:
              raise SystemExit('employee content anchor not found')
          s=s.replace(old_content,new_content,1)
          old_guide="if(page==='Laporan')return <ReportsManagement profile={profile}/>;if(page==='Pengaturan')return <CompanyWorkflow profile={profile}/>;"
          new_guide="if(page==='Laporan')return <ReportsManagement profile={profile}/>;if(page==='Panduan')return <GuideManagement profile={profile}/>;if(page==='Pengaturan')return <CompanyWorkflow profile={profile}/>;"
          if old_guide not in s:
              raise SystemExit('guide content anchor not found')
          s=s.replace(old_guide,new_guide,1)
          p.write_text(s)
          PY
      - name: Install and build
        run: |
          npm install
          npm run build
      - name: Commit finalized feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx package-lock.json
          git commit -m "feat: activate Excel employee import and in-app guide"
          git push
